[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindearth"
version = "0.1.0"
description = "Blind Earth eval runner: ask text-only models 'Land or Water?' per grid cell, store runs, compare and report."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pillow>=10",
  "scikit-image>=0.22",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.40",
  "google-genai>=0.3",
  "keyring>=24",
]

[project.optional-dependencies]
ui = ["gradio>=4.40"]
local = ["torch>=2.2", "transformers>=4.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
blindearth = "blindearth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["blindearth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
