# Default token prices, USD per 1M tokens. DEFAULTS TO VERIFY: prices change, and several entries
# below are best guesses. Check each against the vendor's pricing page before trusting a budget.
# Override any entry with a file of the same format named by env BLINDEARTH_PRICING, or per model
# in the registry with `pricing: {input: ..., output: ...}`.
#
# Keys: model name as sent, optionally prefixed with a provider id or kind
# ("openrouter/anthropic/claude-opus-5-5"). Prefix matching picks the longest key that the model
# name starts with, so dated snapshots resolve to their family.
# Thinking/reasoning tokens bill as output. Batch APIs (Anthropic, OpenAI, Gemini) are ~50% off.

